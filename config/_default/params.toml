#################### default params ################################

# Brand Bar (inside header)
siteBrand = true
BrandName = "What's Up Research?!"
BrandLogo = "img/WhatsUpResearch-logo.png"
BrandBorder = "rounded" # Use rounded or rounded-circle
siteBrandWidth = 38
siteBrandHeight = 38

tagline = "Responsive Hugo Theme"
description = "Blog for accessible scientific communication of recent research from various disciplines."
keywords = "Science"
author = "OwlyFlow"
author_resume = "<strong>OwlyFlow</strong> is the author of these posts, please visit the <em>About page</em> to learn more about her!"

# Date format. See https://gohugo.io/functions/format/
dateformat = "Monday, January 2, 2006"

# Number of post on pagination list
paginate = "6"

# Summary length on list post 
summaryLength = "225"

# Enable or disable search
disableSearch = false 

# YouTube Channel ID
# YTChannelID = "UClA8GwWzurVCprEY6OsCvhw"

# Formspree Contact Form Link
contact_form_action = "https://formspree.io/f/+codenumber"

# Google Analytics 4 (GA4) Configuration
[google_analytics_config]
enable = true
type = "gtag" # or "analytics" for Universal Analytics (not recommended for new setups)
id = "G-XXXXXXXXXX" # Replace with your GA4 ID

# Mailchimp Configuration
[mailchimp]
enable = false
subdomain = "registeredname"
user_id = "code"
list_id = "code"

# Disqus Configuration
[disqus]
enable = true
shortname = "your-shortname-disqus" # Replace with your Disqus shortname

#################### Social link Buttons ################################
[[social.links]]
title = "medium"
icon = "fa fa-medium-m"
link = "https://medium.com/@yourusername"

[[social.links]]
title = "facebook"
icon = "fa fa-facebook-f"
link = "https://www.facebook.com/yourusername"

[[social.links]]
title = "bluesky"
icon = "fa fa-bluesky"
link = "https://bsky.app/yourusername"

[[social.links]]
title = "instagram"
icon = "fa fa-instagram"
link = "https://www.instagram.com/yourusername/"

[[social.links]]
title = "pinterest"
icon = "fa fa-pinterest-p"
link = "https://www.pinterest.it/yourusername"

[[social.links]]
title = "telegram"
icon = "fa fa-telegram-plane"
link = "https://telegram.me/yourusername"

[[social.links]]
title = "rss"
icon = "fa fa-rss-square"
link = "/index.xml"

#################### Social Share Buttons ################################
[social.share]
enable = true
Bluesky = true
Facebook = false
Linkedin = true
Whatsapp = false
Telegram = false
Email = true
Pinterest = false
Reddit = false
Pocket = false
Instapaper = false

[assets]
favicon = "favicon/favicon.ico"
favicon16x16 = "favicon/favicon-16x16.png"
favicon32x32 = "favicon/favicon-32x32.png"
apple_touch_icon = "favicon/apple-touch-icon.png"
safari_pinned_tab = "favicon/safari-pinned-tab.svg"
theme_color = "#18354c"
msapplication_TileColor = "#ffc40d"
